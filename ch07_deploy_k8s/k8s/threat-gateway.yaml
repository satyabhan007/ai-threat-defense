apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-threat-gateway
  namespace: ai-security
  labels:
    app.kubernetes.io/name: ai-threat-gateway
    app.kubernetes.io/part-of: ai-threat-defense
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-threat-gateway
  template:
    metadata:
      labels:
        app: ai-threat-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/satyabhan007/ai-threat-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-threat-gateway-svc
  namespace: ai-security
spec:
  type: ClusterIP
  selector:
    app: ai-threat-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-threat-gateway-hpa
  namespace: ai-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-threat-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
