[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-threat-defense"
version = "1.0.0"
authors = [
  { name="Satyabhan Umed Bhadoriya", email="satyabhan.bhadoriya@gmail.com" },
]
description = "Production-grade AI Threat Detection, Adversarial Robustness & Go Gateway Engineering Curriculum"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "onnxruntime>=1.16.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0.0",
]
