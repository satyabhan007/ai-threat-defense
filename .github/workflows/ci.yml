name: AI Threat Defense CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    name: Python Test Suite & Adversarial Benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run All Python Verification Checks
        run: |
          python tests/run_all_checks.py
      - name: Run Adversarial Robustness Benchmark
        run: |
          python ch06_adversarial_evals/testbed_eval.py

  go-test:
    name: Go Security Gateway Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go Unit & Integration Tests
        run: |
          cd ch05_golang_gateway
          go test -v -race ./...
      - name: Build Gateway Binary
        run: |
          cd ch05_golang_gateway
          go build -v -o ../bin/threat-gateway ./cmd/gateway
